<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved for Later Reel</title>
<style>
  :root { --bg: #f4f1ea; --panel: #fff; --ink: #14171c; --muted: #6b6b66; --line: #e2ded4; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #171614; --panel: #22201d; --ink: #ece9e3; --muted: #a29e96; --line: #36332e; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #171614; --panel: #22201d; --ink: #ece9e3; --muted: #a29e96; --line: #36332e; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 16px; }
  #frame { width: min(1280px, 100%); aspect-ratio: 16 / 9; position: relative; overflow: hidden; box-shadow: 0 12px 32px rgba(60,40,10,.12); }
  .bar { display: flex; gap: 10px; align-items: center; width: min(1280px, 100%); }
  input[type=range] { flex: 1; accent-color: #1e7be0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #1e7be0; outline-offset: 2px; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  body.export main { padding: 0; }
  body.export .bar, body.export .meta { display: none; }
  body.export #frame { width: 1920px; box-shadow: none; }

  #stage1080 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #fcedbc; }

  /* ---------- iPhone 17: same outer size as the Vision Health phone (414 x 868), thinner bezel ---------- */
  .phone { position: absolute; left: 753px; top: 106px; width: 414px; height: 868px; border-radius: 62px; background: #0b0b0c;
           box-shadow: 0 0 0 1.5px #d9dbe0, 0 0 0 3.5px #b3b6bd, 0 0 0 4.5px #969aa2, 0 60px 90px -30px rgba(90,60,10,.30), 0 24px 50px -12px rgba(90,60,10,.18); }
  .phone .side { position: absolute; width: 4px; background: #a3a7af; border-radius: 2px; }
  .screen { position: absolute; left: 9px; top: 9px; width: 396px; height: 850px; border-radius: 54px; overflow: hidden; isolation: isolate; }
  .island { position: absolute; left: 136px; top: 11px; width: 124px; height: 36px; border-radius: 19px; background: #000; z-index: 40; }
  .status { position: absolute; left: 0; top: 0; width: 396px; height: 54px; z-index: 30; pointer-events: none; color: #0e0e0e; }
  .status .time { position: absolute; left: 50px; top: 17px; font: 600 16.5px/1 -apple-system, "SF Pro Text", Inter, "Helvetica Neue", sans-serif; letter-spacing: -.01em; }
  .status svg { position: absolute; top: 21px; }
  .homeind { position: absolute; left: 131px; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #111; z-index: 30; }

  /* ---------- the Saved for Later artifact, sized to the phone screen ---------- */
  .stage {
    position: absolute; inset: 0; container-type: size; overflow: hidden;
    --ink: #0e0e0e; --board: #e2e2e1; --grid: #c4c4c3;
    --glass: rgba(246, 246, 245, 0.58); --glass-edge: rgba(255, 255, 255, 0.75);
    --display: "Instrument Serif", "Didot", "Bodoni 72", "Times New Roman", serif;
    --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    background-color: var(--board); color: var(--ink); font-family: var(--sans);
    --cell: 8cqw;
    background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    background-position: calc(50% + var(--cell) / 2) calc(50% + var(--cell) / 2);
  }
  .title { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2.4cqw; }
  .pill { font-family: var(--sans); font-size: 2.55cqw; letter-spacing: 0.02em; padding: 1.15cqw 2.1cqw; border: 1px solid var(--ink); border-radius: 50%; line-height: 1; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 15.5cqw; line-height: 0.84; letter-spacing: -0.035em; text-align: center; display: flex; flex-direction: column; align-items: center; }
  h1 .line { display: block; white-space: nowrap; }
  h1 em { font-style: italic; letter-spacing: -0.03em; }

  .dock { position: absolute; left: 50%; bottom: calc(6cqw + 14px); z-index: 5; display: flex; align-items: center; gap: 2.1cqw; padding: 2.1cqw 2.6cqw; border-radius: 3.6cqw;
          background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: 0 0.6cqw 3cqw -1cqw rgba(0,0,0,.18), 0 0 0 0.5px rgba(0,0,0,.06);
          -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); }
  .slot { position: relative; width: 11.2cqw; height: 11.2cqw; display: grid; place-items: center; }
  .slot svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .slot.finder { width: 10cqw; height: 10cqw; }
  .slot.trash { width: 8.2cqw; height: 10cqw; }
  .divider { width: 1px; align-self: stretch; margin-block: 1.4cqw; background: rgba(0,0,0,.16); }
  .folder { width: 100%; height: 100%; transform-origin: 50% 100%; }
  .folder .paper, .folder .paper-back, .folder .front { transform-box: fill-box; }
  .folder .front { transform-origin: 50% 100%; }
  .dot { position: absolute; bottom: -1.2cqw; left: 50%; width: 0.7cqw; height: 0.7cqw; margin-left: -0.35cqw; border-radius: 50%; background: rgba(0,0,0,.55); opacity: 0; }

  .cards { position: absolute; inset: 0; z-index: 6; }
  .card { position: absolute; left: 0; top: 0; width: 17cqw; height: 17cqw; opacity: 0; }
  .card .inner { width: 100%; height: 100%; box-sizing: border-box; padding: 0.95cqw; background: #fff; border-radius: 1.5cqw;
                 box-shadow: 0 0.2cqw 0.4cqw rgba(0,0,0,.12), 0 1.4cqw 2.8cqw -1cqw rgba(0,0,0,.28); }
  .card .inner svg { display: block; width: 100%; height: 100%; border-radius: 0.7cqw; }
  .cursor { position: absolute; left: 0; top: 0; z-index: 20; width: 2.9cqw; height: auto; opacity: 0; filter: drop-shadow(0 0.2cqw 0.25cqw rgba(0,0,0,.3)); transform-origin: 0 0; }
</style>

  document.head.appendChild(css);

  // ---------- easing ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = (t) => ((ax * t + bx) * t + cx) * t, Y = (t) => ((ay * t + by) * t + cy) * t, dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = X(t) - x; if (Math.abs(e) < 1e-6) break; const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= e / d; } return Y(clamp(t)); };
  }
  // the artifact's own curves
  const RISE = bezier(.2, .7, .2, 1), DOCK = bezier(.2, 1.25, .35, 1), POP = bezier(.3, 1.6, .5, 1), POP2 = bezier(.3, 1.5, .5, 1);

     <g stroke="#1d1d1d" stroke-width="2.4" stroke-linecap="round"><line x1="36" y1="64" x2="30" y2="84"/><line x1="64" y1="64" x2="70" y2="84"/><line x1="50" y1="64" x2="50" y2="82"/></g>`,
    `<rect width="100" height="100" fill="#f3f1ec"/><rect x="8" y="8" width="16" height="70" fill="#21352a"/><rect x="26" y="8" width="16" height="70" fill="#6f8b5e"/>
     <rect x="44" y="8" width="16" height="70" fill="#d9c49a"/><rect x="62" y="8" width="16" height="70" fill="#c97b5a"/><rect x="80" y="8" width="12" height="70" fill="#8e2f2b"/>
     <g fill="#9a9a96"><rect x="8" y="84" width="12" height="2"/><rect x="26" y="84" width="12" height="2"/><rect x="44" y="84" width="12" height="2"/><rect x="62" y="84" width="12" height="2"/></g>`,
    `<rect width="100" height="100" fill="#2f5a3b"/>
     <g fill="#f2a3b8"><circle cx="20" cy="22" r="7"/><circle cx="64" cy="18" r="6"/><circle cx="40" cy="48" r="8"/><circle cx="80" cy="56" r="7"/><circle cx="22" cy="78" r="6"/><circle cx="62" cy="84" r="8"/></g>
     <g fill="#fff3c9"><circle cx="20" cy="22" r="2.4"/><circle cx="64" cy="18" r="2"/><circle cx="40" cy="48" r="2.6"/><circle cx="80" cy="56" r="2.4"/><circle cx="22" cy="78" r="2"/><circle cx="62" cy="84" r="2.6"/></g>
     <g fill="#f6e6a5"><circle cx="44" cy="22" r="4"/><circle cx="86" cy="30" r="4"/><circle cx="12" cy="52" r="4"/><circle cx="60" cy="62" r="4"/><circle cx="40" cy="80" r="4"/><circle cx="86" cy="86" r="4"/></g>`,
  ];
  const TILT = [-8, 5, 6, -3, 7, -6, 4, -7, 6, -4];
  const N = ART.length;

  const $ = (id) => document.getElementById(id);
  const phone = $('phone'), stage = $('stage'), layer = $('cards'), slot = $('folderSlot'), folder = $('folder'), dock = $('dock'), cursor = $('cursor');
  const rises = [...stage.querySelectorAll('[data-rise]')];
  const cards = ART.map((art, i) => {
    const el = document.createElement('div');
    el.className = 'card'; el.style.zIndex = String(i + 1);
    el.innerHTML = `<div class="inner"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">${art}</svg></div>`;
    layer.appendChild(el);
    return el;
  });

  // ---------- the arc (same maths as the artifact, measured in screen points) ----------
  let W, H, cardSize, lut, pathLen, gap, rest, maxOff, FX, FY;
  function measure() {
    W = stage.offsetWidth; H = stage.offsetHeight; cardSize = cards[0].offsetWidth;
    // folder slot centre in stage coordinates, measured with the dock at rest and the phone in place
    const ph0 = phone.style.transform, d0 = dock.style.transform;
    phone.style.transform = 'none'; dock.style.transform = 'translate(-50%, 0)';
    const sr = stage.getBoundingClientRect(), fr = slot.getBoundingClientRect(), k = sr.width / W;
    FX = (fr.left - sr.left + fr.width / 2) / k; FY = (fr.top - sr.top + fr.height * 0.42) / k;
    phone.style.transform = ph0; dock.style.transform = d0;
    // the artifact's stage is 9:16; the phone is taller, so bend the arc as if it were 9:16 tall
    const WA = H * 9 / 16;
    const rise = FY + 0.4 * W;
    lut = []; pathLen = 0;
    let px = FX, py = FY;
    for (let k = 0; k <= 300; k++) {
      const r = rise * k / 300, xx = FX + 0.16 * W * (r / WA) ** 1.8, yy = FY - r;
      if (k) pathLen += Math.hypot(xx - px, yy - py);
      lut.push({ s: pathLen, x: xx, y: yy }); px = xx; py = yy;
    }
    gap = 0.23 * W;
    rest = gap * Math.round((pathLen - 0.3 * W) / gap);
    maxOff = rest + (N - 7) * gap;
  }
  function at(s) {
    let lo = 0, hi = lut.length - 1;
    if (s <= 0) return { x: lut[0].x, y: lut[0].y, a: 0 };
    if (s >= lut[hi].s) return { x: lut[hi].x, y: lut[hi].y, a: 0 };
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (lut[m].s < s) lo = m; else hi = m; }
    const A = lut[lo], B = lut[hi], u = (s - A.s) / (B.s - A.s || 1);
    return { x: A.x + (B.x - A.x) * u, y: A.y + (B.y - A.y) * u, a: Math.atan2(B.x - A.x, A.y - B.y) };
  }

  // The artifact eases the gallery toward its target a little every frame (rate .06 open, .12 closed).
  // Run that same per-frame filter once over the whole timeline so any frame can be rendered on its own.
  let OFF = [];
  function simulate() {
    const target = (t) => {
      if (t < T.open) return -gap;
      if (t >= T.close) return -gap;
      if (t < T.browse) return rest;
      if (t < T.back) return lerp(rest, maxOff, EASE(ph(t, T.browse, T.browseDur)));
      return lerp(maxOff, rest, EASE(ph(t, T.back, T.backDur)));
    };
    let off = -gap; OFF = [];
    for (let f = 0; f <= Math.ceil(DURATION * FPS); f++) {
      const t = f / FPS, open = t >= T.open && t < T.close, k = 1 - Math.pow(1 - (open ? 0.06 : 0.12), 1);
      const tg = target(t);
      if (Math.abs(tg - off) > 0.05) off += (tg - off) * k;
      OFF.push(off);
    }
  }

  // ---------- render one moment ----------
  const paper = $('paper'), paperBack = $('paperBack'), front = $('front'), dot = $('dot');
  function renderAt(t) {
    // phone: swipe up from below, swipe up and away at the end
    const pin = IO(ph(t, T.phoneIn, T.phoneInDur)), pout = IN(ph(t, T.out, T.outDur));
    phone.style.transform = `translateY(${(1100 * (1 - pin) - 1150 * pout).toFixed(2)}px)`;

    // headline: each line rises out of a blur, 0.13 s apart
    rises.forEach((e, i) => {
      const q = RISE(ph(t, T.intro + 0.2 + i * 0.13, 0.9));
      e.style.opacity = q.toFixed(3);
      e.style.transform = `translateY(${(0.9 * (1 - q)).toFixed(3)}cqw)`;
      e.style.filter = q >= 1 ? 'none' : `blur(${(4 * (1 - q)).toFixed(2)}px)`;
    });

    // dock: springs up from below
    const dq = DOCK(ph(t, T.dock, 0.85));
    dock.style.transform = `translate(-50%, ${(170 * (1 - dq)).toFixed(2)}%)`;
    dock.style.opacity = EASE(ph(t, T.dock, 0.4)).toFixed(3);

    // pointer path: in from the lower right, onto the folder, up with the browse, back, then off to empty space
    const fx = FX, fy = FY + 4;
    const start = { x: W * 0.8, y: H * 0.7 }, away = { x: W * 0.3, y: H * 0.68 };
    let cx = start.x, cy = start.y, cop = 0;
    if (t >= T.cursorIn) {
      cop = OUT(ph(t, T.cursorIn, 0.25));
      const q = IO(ph(t, T.cursorIn, T.cursorDur)); cx = lerp(start.x, fx, q); cy = lerp(start.y, fy, q);
      const lv = IO(ph(t, T.leave, T.leaveDur)); cx = lerp(cx, away.x, lv); cy = lerp(cy, away.y, lv);
      if (t >= T.out - 0.2) cop *= 1 - ph(t, T.out - 0.2, 0.2);
    }
    let press = 0;
    for (const c of [T.open, T.close]) press = Math.max(press, Math.sin(Math.PI * ph(t, c - 0.08, 0.2)));
    cursor.style.opacity = cop.toFixed(3);
    cursor.style.transform = `translate(${(cx - 1).toFixed(2)}px, ${(cy - 1).toFixed(2)}px) scale(${(1 - 0.12 * press).toFixed(3)})`;

    // folder: lifts while hovered or open (the artifact's .hot / .open state)
    const hoverOn = T.cursorIn + T.cursorDur - 0.15, hoverOff = T.close;
    let h = POP(ph(t, hoverOn, 0.45));
    if (t >= hoverOff) h = 1 - POP(ph(t, hoverOff, 0.45));
    const h2 = t >= hoverOff ? 1 - POP2(ph(t, hoverOff, 0.45)) : POP2(ph(t, hoverOn, 0.45));
    const click = Math.max(Math.sin(Math.PI * ph(t, T.open - 0.06, 0.18)), Math.sin(Math.PI * ph(t, T.close - 0.06, 0.18)));
    const fs = 1 + 0.14 * h - 0.08 * click, fty = -0.7 * h + 0.4 * click;
    folder.style.transform = `translateY(${fty.toFixed(3)}cqw) scale(${fs.toFixed(4)})`;
    paper.style.transform = `translateY(${(-8 * h2).toFixed(2)}px)`;
    paperBack.style.transform = `translateY(${(-5 * h2).toFixed(2)}px) rotate(${(-3 * h2).toFixed(2)}deg)`;
    front.style.transform = `scaleY(${(1 - 0.07 * h2).toFixed(4)}) skewX(${(-2 * h2).toFixed(2)}deg)`;
    dot.style.opacity = (t >= T.open && t < T.close ? clamp((t - T.open) / 0.3) : t >= T.close ? 1 - clamp((t - T.close) / 0.3) : 0).toFixed(3);

    // cards along the arc
    const offset = OFF[Math.min(OFF.length - 1, Math.round(t * FPS))];
    for (let i = 0; i < N; i++) {
      const el = cards[i], s = offset - i * gap;
      if (s <= 0) { el.style.opacity = '0'; el.style.visibility = 'hidden'; continue; }
      const p = at(s), e = clamp(s / (gap * 0.75)), ease = 1 - (1 - e) ** 3;
      const scale = 0.32 + 0.68 * ease, rot = TILT[i] * ease + (p.a * 180 / Math.PI) * 0.35;
      el.style.visibility = 'visible';
      el.style.opacity = String(clamp(s / (gap * 0.22)));
      el.style.transform = `translate(${(p.x - cardSize / 2).toFixed(2)}px, ${(p.y - cardSize / 2).toFixed(2)}px) rotate(${rot.toFixed(3)}deg) scale(${scale.toFixed(4)})`;
    }
  }

  // ---------- playback & export ----------
  const stage1080 = $('stage1080'), frame = $('frame');
  function fit() { if (!document.body.classList.contains('export')) stage1080.style.transform = `scale(${frame.clientWidth / 1920})`; }
  window.addEventListener('resize', fit); fit();
  const scrub = $('scrub'), playBtn = $('play'), meta = $('meta');
  let playing = true, t0 = performance.now(), tNow = 0, exporting = false, ready = false;
  function tick(now) {
    if (exporting) return;
    if (playing && ready) { tNow = ((now - t0) / 1000) % DURATION; renderAt(tNow); scrub.value = String(Math.round((tNow / DURATION) * 1000)); meta.textContent = `${tNow.toFixed(2)} s / ${DURATION} s · 1920 × 1080 · 60 fps`; }
    requestAnimationFrame(tick);
  }
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; if (playing) t0 = performance.now() - tNow * 1000; };
  scrub.oninput = () => { playing = false; playBtn.textContent = 'Play'; tNow = (scrub.value / 1000) * DURATION; renderAt(tNow); };

  const readyP = document.fonts.ready.then(() => { measure(); simulate(); ready = true; renderAt(0); t0 = performance.now(); });
  requestAnimationFrame(tick);
  window.anim = {
    timeline: { duration: DURATION, fps: FPS },
    ready: readyP,
    exportMode(on) { exporting = on; document.body.classList.toggle('export', on); stage1080.style.transform = on ? 'none' : ''; if (!on) fit(); },
    renderAt,
  };
})();
</script>
</body>
</html>
