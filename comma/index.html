<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comma Show Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f3f1f6;
    --panel: #ffffff;
    --ink: #1d1a22;
    --muted: #6d6875;
    --line: #e4e0ea;
    --accent: #333333;
    --on-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17151a; --panel: #211f25; --ink: #efecf3; --muted: #a29dab;
      --line: #36323d; --accent: #d9d4e2; --on-ink: #17151a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17151a; --panel: #211f25; --ink: #efecf3; --muted: #a29dab;
    --line: #36323d; --accent: #d9d4e2; --on-ink: #17151a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    align-items: flex-start;
    justify-content: center;
    padding-block: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .stage-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  /* 958 x 632 buffer (2x), shown at the true 479 x 316 frame size. */
  #stage {
    width: 479px;
    max-width: 100%;
    height: auto;
    aspect-ratio: 479 / 316;
    display: block;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(40,30,60,.12);
  }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .panel {
    width: 300px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    display: grid;
    gap: 14px;
  }
  h1 { font-size: 15px; margin: 0; }
  label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; border-radius: 8px; padding: 9px 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { font-size: 12px; color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <div class="stage-wrap">
    <canvas id="stage" width="958" height="632"></canvas>
    <div class="meta" id="meta">479 × 316 · 2x</div>
  </div>

  <div class="panel">
    <h1>Comma · show reel</h1>
    <label>Scrub
      <input type="range" id="scrub" min="0" max="1000" value="0">
    </label>
    <div class="two">
      <button id="play">Pause</button>
      <button id="restart">Restart</button>
    </div>
    <button class="primary" id="exportMp4">Export MP4 loop</button>
    <div id="status"></div>
  </div>
</main>

<script src="assets/embedded.js"></script>
<script src="../vendor/mp4-muxer.js"></script>
<script>
(() => {
  const { images: IMG_SRC, layout: L } = window.COMMA_ASSETS;
  const OUT_W = 958, OUT_H = 632;     // 479 x 316 at 2x
  const OFFSET = [-1, -1];            // source frames are 961 x 634; trim the soft 1px edge

  // ---------- Timeline (seconds) ----------
  const T = {
    duration: 6.25,
    fps: 60,
    approach: [0.0, 0.85],   // cursor glides in from the right onto the title pill
    press: [0.85, 0.12],     // click: press down, then release
    expand: [0.93, 0.45],    // collapsed -> expanded
    exit: [1.5, 0.45],       // cursor leaves to the right
    pan: [2.3, 1.25],        // card scrolls up, the dashboard rises into the centre
    back: [4.75, 1.3],       // dashboard drops away, the collapsed card comes down from the top
  };
  const CURSOR_START = [1010, 300];   // just off the right edge, centre height
  const CURSOR_CLICK = [392, 290];    // on the "System Design" pill
  const CURSOR_CURVE = [700, 372];    // pulls the path into a gentle arc
  const CURSOR_END = [1020, 410];

  // ---------- Maths ----------
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t;
    const sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= (sx(t) - x) / d; }
      return sy(clamp01(t));
    };
  }
  // Brisk start, soft settle: the same feel as the reference card.
  const easeOpen = bezier(0.32, 0.72, 0, 1);
  const easeGlide = bezier(0.3, 0.1, 0.2, 1);    // cursor arriving
  const easeLeave = bezier(0.5, 0, 0.75, 0.4);   // cursor accelerating away
  const easePan = bezier(0.65, 0, 0.25, 1);      // smooth in, fast middle, soft landing
  const phase = ([start, dur], t) => clamp01((t - start) / dur);
  const quad = (a, c, b, u) => [0, 1].map((k) => (1 - u) * (1 - u) * a[k] + 2 * (1 - u) * u * c[k] + u * u * b[k]);

  function cursorAt(t) {
    if (t < T.exit[0]) return quad(CURSOR_START, CURSOR_CURVE, CURSOR_CLICK, easeGlide(phase(T.approach, t)));
    const u = easeLeave(phase(T.exit, t));
    return [lerp(CURSOR_CLICK[0], CURSOR_END[0], u), lerp(CURSOR_CLICK[1], CURSOR_END[1], u)];
  }
  // Cursor squeeze for the click: 1 at rest, 0.84 at the bottom of the press.
  function cursorScale(t) {
    const [s0, d] = T.press;
    return 1 - 0.16 * (smooth(s0, s0 + d * 0.45, t) - smooth(s0 + d * 0.45, s0 + d, t));
  }

  // Morph progress p (0 = collapsed, 1 = expanded) and its speed.
  const progress = (t) => easeOpen(phase(T.expand, t));
  const speedAt = (t) => Math.abs(progress(t + 0.004) - progress(t - 0.004)) / 0.008;
  const MAX_SPEED = (() => { let m = 0; for (let t = 0; t < T.duration; t += 0.002) m = Math.max(m, speedAt(t)); return m || 1; })();

  // Scroll distance: the expanded card leaves the top while the dashboard
  // window rises to its resting spot, keeping the gap from the reference.
  const PAN_DIST = (L.card.to[3] + L.dash.gap) - (L.dash.y + L.dash.windowTop);
  const panAt = (t) => PAN_DIST * easePan(phase(T.pan, t));
  // On the way back the dashboard and the collapsed card travel together with
  // the wider gap from the return storyboard, and the card lands where it began.
  const BACK_DIST = (L.card.from[3] + L.dash.gapBack) - (L.dash.y + L.dash.windowTop);
  const backAt = (t) => BACK_DIST * easePan(phase(T.back, t));

  // ---------- Drawing ----------
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const img = {};

  function roundRect(x0, y0, x1, y1, r) {
    ctx.beginPath();
    ctx.moveTo(x0 + r, y0);
    ctx.arcTo(x1, y0, x1, y1, r);
    ctx.arcTo(x1, y1, x0, y1, r);
    ctx.arcTo(x0, y1, x0, y0, r);
    ctx.arcTo(x0, y0, x1, y0, r);
    ctx.closePath();
  }
  const lerpBox = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));

  function sprite(image, box, dest, alpha, blur, op) {
    if (alpha <= 0.002) return;
    const [sx0, sy0, sx1, sy1] = box, [dx0, dy0, dx1, dy1] = dest;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = op || 'source-over';
    if (blur > 0.05) ctx.filter = `blur(${blur.toFixed(2)}px)`;
    ctx.drawImage(image, sx0, sy0, sx1 - sx0, sy1 - sy0, dx0, dy0, dx1 - dx0, dy1 - dy0);
    ctx.restore();
  }

  function sharedBox(name, p) { const s = L.shared[name]; return lerpBox(s.from, s.to, p); }
  function avatarAt(i, p) {
    const a = L.avatars[i];
    return { cx: lerp(a.from.cx, a.to.cx, p), cy: lerp(a.from.cy, a.to.cy, p), r: lerp(a.from.r, a.to.r, p) };
  }
  // How far an anchor still is from where it ends up (for elements that ride along).
  function anchorDelta(anchor, p, end) {
    if (!anchor) {                                       // ride with the card's top edge
      const top = lerp(L.card.from[1], L.card.to[1], p), endTop = lerp(L.card.from[1], L.card.to[1], end);
      return [0, 0.5 * (top - endTop)];
    }
    if (anchor.startsWith('av')) {
      const i = +anchor.slice(2), a = avatarAt(i, p), e = avatarAt(i, end);
      return [a.cx - e.cx, a.cy - e.cy];
    }
    const b = sharedBox(anchor, p), e = sharedBox(anchor, end);
    return [b[0] - e[0], b[1] - e[1]];
  }

  function drawMorph(p, blurAmt) {
    const card = lerpBox(L.card.from, L.card.to, p);
    ctx.save();
    roundRect(...card, L.card.radius);
    ctx.fillStyle = L.card.color;
    ctx.fill();
    ctx.clip();                                         // everything below stays inside the card

    // New parts of the expanded card fade and sharpen into place, top to bottom.
    for (const n of L.new) {
      const start = 0.36 + 0.04 * n.order;
      const a = smooth(start, start + 0.34, p);
      if (a <= 0) continue;
      let [dx, dy] = anchorDelta(n.anchor, p, 1);
      if (!n.anchor) dy -= (1 - a) * 14;
      const [x0, y0, x1, y1] = n.box;
      sprite(img.f2new, n.box, [x0 + dx, y0 + dy, x1 + dx, y1 + dy], a, (1 - a) * 5);
    }

    // Title pill.
    const pill = lerpBox(L.pill.from, L.pill.to, p);
    roundRect(pill[0], pill[1], pill[2], pill[3], pill[4]);
    ctx.fillStyle = L.pill.color;
    ctx.fill();

    // Shared elements glide between their two positions, cross-fading.
    const s = smooth(0.15, 0.7, p);
    for (const name of Object.keys(L.shared)) {
      const sh = L.shared[name], dest = sharedBox(name, p);
      sprite(img.f1, sh.from, dest, 1 - s, blurAmt, 'lighten');
      sprite(img.f2, sh.to, dest, s, blurAmt, 'lighten');
    }

    // Collapsed-only labels slip away with their icon.
    const fadeOld = 1 - smooth(0.0, 0.32, p);
    for (const name of Object.keys(L.old)) {
      const o = L.old[name];
      const [dx, dy] = anchorDelta(o.anchor, p, 0);
      const [x0, y0, x1, y1] = o.box;
      sprite(img.f1, o.box, [x0 + dx, y0 + dy, x1 + dx, y1 + dy], fadeOld, blurAmt + (1 - fadeOld) * 4, 'lighten');
    }

    // Avatars spread from the stacked row into their chips (right one on top).
    const sa = smooth(0.2, 0.8, p);
    L.avatars.forEach((a, i) => {
      const at = avatarAt(i, p);
      for (const [spec, alpha] of [[a.from, 1], [a.to, sa]]) {
        const k = at.r / spec.r;
        const w = spec.w * k, h = spec.h * k;
        const ox = at.cx - (spec.cx - spec.x) * k, oy = at.cy - (spec.cy - spec.y) * k;
        sprite(img[spec.img], [0, 0, spec.w, spec.h], [ox, oy, ox + w, oy + h], alpha, blurAmt * 0.8);
      }
    });
    ctx.restore();
  }

  function drawCursor([x, y], scale) {
    const pts = [[0, 0], [0, 16.6], [4.1, 12.9], [6.7, 19], [9.2, 18], [6.7, 12], [11.9, 12]];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(2 * scale, 2 * scale);
    ctx.beginPath();
    pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    ctx.closePath();
    ctx.shadowColor = 'rgba(0,0,0,0.28)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetY = 0.8;
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#111111';
    ctx.fill();
    ctx.restore();
  }

  // Soft ring that spreads from the click point.
  function drawRipple(t) {
    const u = clamp01((t - T.press[0] - 0.03) / 0.42);
    if (u <= 0 || u >= 1) return;
    const e = 1 - Math.pow(1 - u, 3);
    ctx.save();
    ctx.beginPath();
    ctx.arc(CURSOR_CLICK[0], CURSOR_CLICK[1], 6 + 30 * e, 0, Math.PI * 2);
    ctx.lineWidth = 3 * (1 - u) + 0.5;
    ctx.strokeStyle = `rgba(255,255,255,${0.55 * (1 - u)})`;
    ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${0.10 * (1 - u)})`;
    ctx.fill();
    ctx.restore();
  }

  // During the scroll everything is drawn on a layer first, then laid down
  // with a vertical motion blur that follows the scroll speed.
  const layer = document.createElement('canvas');
  layer.width = L.size[0]; layer.height = L.size[1];
  const lctx = layer.getContext('2d');

  // Draw an image on the scroll layer, scaled about its own centre.
  function place(image, x, y, k) {
    const w = image.width, h = image.height;
    lctx.save();
    lctx.translate(x + w / 2, y + h / 2);
    lctx.scale(k, k);
    lctx.drawImage(image, -w / 2, -h / 2);
    lctx.restore();
  }

  // Lay the scroll layer down with a vertical motion blur that follows the speed.
  function blurDown(v) {
    const len = Math.min(16, v / T.fps * 0.38);
    const n = len < 0.6 ? 1 : 9;
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * len;
      ctx.globalAlpha = 1 / (i + 1);
      ctx.drawImage(layer, 0, off);
    }
    ctx.globalAlpha = 1;
  }

  // Up: the expanded card leaves the top (easing back a touch) while the
  // dashboard rises from below and grows into place.
  function drawPan(t) {
    const u = phase(T.pan, t), s = panAt(t);
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.clearRect(0, 0, layer.width, layer.height);
    place(img.c2, L.card.to[0], L.card.to[1] - s, 1 - 0.05 * easePan(u));
    place(img.dash, L.dash.x, L.dash.y + (PAN_DIST - s), 0.93 + 0.07 * easeOpen(clamp01((u - 0.1) / 0.9)));
    blurDown(Math.abs(panAt(t + 0.004) - panAt(t - 0.004)) / 0.008);
  }

  // Down: the mirror of the way up. The dashboard sinks out (easing back) while
  // the collapsed card comes down from the top and settles on its first spot.
  function drawBack(t) {
    const u = phase(T.back, t), s = backAt(t);
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.clearRect(0, 0, layer.width, layer.height);
    place(img.dash, L.dash.x, L.dash.y + s, 1 - 0.05 * easePan(u));
    place(img.c1, L.card.from[0], L.card.from[1] - (BACK_DIST - s), 0.93 + 0.07 * easeOpen(clamp01((u - 0.1) / 0.9)));
    blurDown(Math.abs(backAt(t + 0.004) - backAt(t - 0.004)) / 0.008);
  }

  function renderAt(t) {
    t = ((t % T.duration) + T.duration) % T.duration;
    ctx.setTransform(1, 0, 0, 1, OFFSET[0], OFFSET[1]);
    ctx.clearRect(0, 0, L.size[0], L.size[1]);
    ctx.drawImage(img.bg, L.bgOffset[0], L.bgOffset[1]);   // the one backdrop, always
    if (t >= T.back[0] + T.back[1]) {
      ctx.drawImage(img.c1, L.card.from[0], L.card.from[1]);   // home again: same as the first frame
    } else if (t >= T.back[0]) {
      drawBack(t);
    } else if (t >= T.pan[0]) {
      drawPan(t);
    } else {
      const p = progress(t);
      if (p <= 0.0005) ctx.drawImage(img.c1, L.card.from[0], L.card.from[1]);   // your frames, untouched
      else if (p >= 0.9995) ctx.drawImage(img.c2, L.card.to[0], L.card.to[1]);
      else drawMorph(p, 2.6 * speedAt(t) / MAX_SPEED);
    }
    drawRipple(t);
    if (t < T.exit[0] + T.exit[1]) drawCursor(cursorAt(t), cursorScale(t));
  }

  function readPixels() {
    const d = ctx.getImageData(0, 0, OUT_W, OUT_H).data;
    let s = '';
    for (let i = 0; i < d.length; i += 0x8000) s += String.fromCharCode.apply(null, d.subarray(i, i + 0x8000));
    return btoa(s);
  }

  const ready = Promise.all(Object.entries(IMG_SRC).map(([k, src]) => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { img[k] = im; res(); };
    im.onerror = rej;
    im.src = src;
  })));

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const status = (m) => { $('status').textContent = m; };
  let playing = true, exporting = false, t0 = performance.now(), held = 0;
  const now = () => playing ? ((performance.now() - t0) / 1000) % T.duration : held;

  $('play').onclick = () => {
    if (playing) { held = now(); playing = false; $('play').textContent = 'Play'; }
    else { t0 = performance.now() - held * 1000; playing = true; $('play').textContent = 'Pause'; }
  };
  $('restart').onclick = () => { t0 = performance.now(); held = 0; };
  $('scrub').oninput = (e) => {
    held = (+e.target.value / 1000) * T.duration;
    if (playing) $('play').click();
  };

  const downloadsCap = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  async function download(blob, filename) {
    if (window.claude?.use) {
      const downloads = await downloadsCap;
      if (!downloads) { status('Saving files is not available in this view. Open comma/index.html from the repo instead.'); return; }
      try { await downloads.save({ filename, data: blob }); }
      catch (e) { if (e.code !== 'declined') status('Could not save: ' + (e.message || e.code)); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  $('exportMp4').onclick = async () => {
    if (!('VideoEncoder' in window)) { status('This browser has no WebCodecs. Use Chrome, Edge or Safari 17+.'); return; }
    const btn = $('exportMp4');
    btn.disabled = true; exporting = true;
    try {
      const fps = T.fps, frames = Math.round(T.duration * fps);
      let cfg = null;
      for (const codec of ['avc1.640033', 'avc1.4d0033', 'avc1.42003e']) {
        const c = { codec, width: OUT_W, height: OUT_H, framerate: fps, bitrate: 14e6, avc: { format: 'avc' } };
        if ((await VideoEncoder.isConfigSupported(c)).supported) { cfg = c; break; }
      }
      if (!cfg) throw new Error('H.264 encoding is not supported in this browser.');
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: OUT_W, height: OUT_H, frameRate: fps }, fastStart: 'in-memory' });
      let failure = null;
      const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { failure = e; } });
      enc.configure(cfg);
      for (let i = 0; i < frames; i++) {
        if (failure) throw failure;
        renderAt(i / fps);
        const f = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        enc.encode(f, { keyFrame: i % (fps * 2) === 0 });
        f.close();
        while (enc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 4));
        if (i % 15 === 0) { status(`Encoding frame ${i + 1} / ${frames}…`); await new Promise((r) => setTimeout(r, 0)); }
      }
      await enc.flush();
      if (failure) throw failure;
      muxer.finalize();
      await download(new Blob([muxer.target.buffer], { type: 'video/mp4' }), 'comma-show-reel@2x.mp4');
      status(`Exported ${frames} frames · 958 × 632 · ${T.duration}s loop.`);
    } catch (e) {
      status('Export failed: ' + e.message);
    } finally {
      exporting = false; btn.disabled = false;
    }
  };

  function tick() {
    if (!exporting) {
      const t = now();
      renderAt(t);
      $('meta').textContent = `479 × 316 · 2x · ${t.toFixed(2)}s / ${T.duration}s`;
      if (playing) $('scrub').value = Math.round((t / T.duration) * 1000);
    }
    requestAnimationFrame(tick);
  }

  window.anim = {
    ready, renderAt, readPixels, timeline: T,
    exportMode: (v) => { exporting = v; },
  };
  ready.then(() => requestAnimationFrame(tick)).catch(() => status('Could not load the frame images.'));
})();
</script>
</body>
</html>
