<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Health Reel</title>
<style>
  :root { --bg: #f1f3f6; --panel: #fff; --ink: #14171c; --muted: #646b78; --line: #dde1e8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15171b; --panel: #1f2228; --ink: #e9ecf1; --muted: #9aa1ad; --line: #30343c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #15171b; --panel: #1f2228; --ink: #e9ecf1; --muted: #9aa1ad; --line: #30343c; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 16px; }
  #frame { width: min(1280px, 100%); aspect-ratio: 16 / 9; position: relative; overflow: hidden;
           box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(20,40,80,.12); }
  .bar { display: flex; gap: 10px; align-items: center; width: min(1280px, 100%); }
  input[type=range] { flex: 1; accent-color: #3d96f2; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid #3d96f2; outline-offset: 2px; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  body.export main { padding: 0; }
  body.export .bar, body.export .meta { display: none; }
  body.export #frame { width: 1920px; box-shadow: none; }

  /* ---------- the 1920 x 1080 stage ---------- */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
           background: radial-gradient(1100px 760px at 62% 46%, #eef1f7 0%, rgba(238,241,247,0) 70%), linear-gradient(180deg, #e4e8f0 0%, #dce2eb 100%);
           font-family: Inter, -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; color: #111; -webkit-font-smoothing: antialiased; }
  #grain { position: absolute; inset: 0; opacity: .022; mix-blend-mode: multiply; pointer-events: none; }
  .m { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }

  /* captions */
  .cap { position: absolute; left: 438px; top: 0; width: 470px; }
  .cap .n { font-size: 17px; font-weight: 600; letter-spacing: .14em; color: #3d8fe8; }
  .cap .h { font-size: 54px; font-weight: 600; letter-spacing: -.025em; line-height: 1.06; color: #12151b; margin-top: 18px; }
  .cap .d { font-size: 22px; line-height: 1.45; color: #5c6574; margin-top: 20px; letter-spacing: -.005em; }
  .cap > * { will-change: auto; }
  .heading { position: absolute; left: 0; width: 1920px; top: 64px; text-align: center; }
  .heading .n { font-size: 16px; font-weight: 600; letter-spacing: .14em; color: #3d8fe8; }
  .heading .h { font-size: 40px; font-weight: 600; letter-spacing: -.02em; color: #12151b; margin-top: 10px; }

  /* phone */
  .phone { position: absolute; left: 0; top: 0; width: 414px; height: 868px; border-radius: 64px; background: #0c0d0f;
           box-shadow: 0 0 0 1.5px #d4d7dd, 0 0 0 3.5px #a9adb5, 0 0 0 4.5px #8d929b, 0 60px 90px -30px rgba(30,50,90,.32), 0 24px 50px -12px rgba(30,50,90,.20); }
  .phone .btn-side { position: absolute; width: 4px; background: #9aa0a8; border-radius: 2px; }
  .screen { position: absolute; left: 12px; top: 12px; width: 390px; height: 844px; border-radius: 52px; overflow: hidden; background: #fff; isolation: isolate; }
  .island { position: absolute; left: 132px; top: 11px; width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 80; }
  .status { position: absolute; left: 0; top: 0; width: 390px; height: 58px; z-index: 70; pointer-events: none; background: linear-gradient(180deg, #fff 0, #fff 50px, rgba(255,255,255,0) 58px); }
  .status .time { position: absolute; left: 52px; top: 17px; font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; }
  .status svg { position: absolute; top: 21px; }
  .homeind { position: absolute; left: 128px; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #111; z-index: 75; }
  .touch { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; z-index: 90;
           background: radial-gradient(circle, rgba(40,44,52,.30) 0%, rgba(40,44,52,.24) 62%, rgba(40,44,52,.10) 100%);
           box-shadow: 0 0 0 1.5px rgba(255,255,255,.75), 0 4px 10px rgba(0,0,0,.16); }

  .scr { position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; }
  .a { position: absolute; }
  .scroll { position: absolute; left: 0; top: 0; width: 390px; }

  /* type */
  .big { font-size: 28px; font-weight: 600; letter-spacing: -.022em; line-height: 33px; }
  .ttl { font-size: 27px; font-weight: 600; letter-spacing: -.022em; }
  .ttl2 { font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
  .sec { font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
  .q { font-size: 21.5px; font-weight: 600; letter-spacing: -.017em; line-height: 28px; }
  .body { font-size: 14.5px; line-height: 18.5px; color: #6c6c72; }
  .date { font-size: 13px; color: #111; }
  .link { color: #3a93ef; }
  .grey { color: #8a8a90; }
  .red { color: #e0285a; }
  .blue { color: #3a93ef; }

  /* controls */
  .btn { display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #48a0f7; color: #fff; font-size: 16px; letter-spacing: -.01em; }
  .pill { display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 1.3px solid #4aa0f6; color: #3a93ef; font-size: 14px; background: #fff; letter-spacing: -.01em; }
  .pill.fill { background: #48a0f7; color: #fff; border-color: #48a0f7; }
  .pill.gry { border-color: #8e8e93; color: #3a3a3c; }
  .pill.blk { border-color: #9a9aa0; color: #4a4a4f; }
  .field { display: flex; align-items: center; border-radius: 999px; border: 1.3px solid #a3a3a8; font-size: 13.5px; color: #a7a7ac; padding-left: 28px; box-sizing: border-box; }
  .field .v { color: #1c1c1e; }
  .caret { display: inline-block; width: 1.6px; height: 17px; background: #3a93ef; margin-left: 1px; vertical-align: -3px; }
  .card { background: #f2f2f4; border-radius: 16px; }
  .tile { background: #fff; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .tile img { display: block; }
  .more { display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 999px; background: #8cc6fa; color: #fff; font-size: 10.5px; font-weight: 500; letter-spacing: .04em; }
  .seg { display: flex; align-items: center; background: #ededf0; border-radius: 9px; font-size: 11.5px; color: #222; }
  .seg div { flex: 1; text-align: center; position: relative; }
  .seg .on { background: #fff; border-radius: 7px; margin: 2px; padding: 5px 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tabbar { position: absolute; left: 0; top: 786px; width: 390px; height: 58px; background: rgba(248,248,249,.97); border-top: .8px solid #dcdce0; z-index: 50; }
  .tab { position: absolute; top: 9px; width: 90px; margin-left: -45px; text-align: center; font-size: 9.5px; }
  .tab svg { display: block; margin: 0 auto 2px; }
  .tab .on { position: absolute; left: 0; top: 0; width: 90px; color: #3a93ef; }
  .tab .off { color: #8a8a8e; }
  .appicon { border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px #e3e3e8; }
  .dot { border-radius: 50%; background: radial-gradient(circle, #1f86ff 0%, #3b98ff 16%, #74b7ff 30%, #a8d2ff 46%, #d3e8ff 62%, rgba(232,243,255,.6) 74%, rgba(255,255,255,0) 80%); }
  .ava { border-radius: 50%; background: #c8c8cc; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 400; }
  .ava.b { background: #8cc6fa; }
  .barv { position: absolute; bottom: 0; border-radius: 99px; }
  .row { background: #f2f2f4; border-radius: 14px; }
  .chev { position: absolute; }
  .wheel { border-radius: 50%; background: conic-gradient(from 0deg, hsl(120 100% 50%), hsl(60 100% 50%) 60deg, hsl(0 100% 50%) 120deg, hsl(300 100% 50%) 180deg, hsl(240 100% 52%) 240deg, hsl(180 100% 50%) 300deg, hsl(120 100% 50%) 360deg); }
  .stars { color: #f5b916; font-size: 12px; letter-spacing: 6px; }
  .book { display: flex; align-items: center; justify-content: center; background: #3d96f2; color: #fff; font-size: 8.5px; letter-spacing: .03em; border-radius: 3px; }
  .alert { position: absolute; inset: 0; z-index: 60; }
</style>
</head>
<body>
<main>
  <div id="frame"><div id="stage"><canvas id="grain" width="480" height="270"></canvas></div></div>
  <div class="bar">
    <button id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub">
  </div>
  <div class="meta" id="meta">1920 × 1080 · 60 fps</div>
</main>

<script src="assets/embedded.js"></script>
<script>
(() => {
  const IMG = window.VH;
  const stage = document.getElementById('stage');

  // ================= easing =================
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = (t) => ((ax * t + bx) * t + cx) * t, Y = (t) => ((ay * t + by) * t + cy) * t;
    const dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = X(t) - x; if (Math.abs(e) < 1e-6) break; const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      return Y(clamp(t));
    };
  }
  const E = {
    ui: bezier(0.22, 1, 0.36, 1),        // calm iOS-like settle
    push: bezier(0.32, 0.72, 0, 1),      // navigation push
    io: bezier(0.65, 0, 0.35, 1),        // camera / phone moves
    out: bezier(0.33, 1, 0.68, 1),
    in: bezier(0.55, 0, 1, 0.45),
    lin: (x) => x,
  };

  // ================= tiny DOM helpers =================
  function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function refs(root) { const k = {}; root.querySelectorAll('[data-k]').forEach((e) => (k[e.dataset.k] = e)); return k; }
  const img = (name, w, h) => `<img src="${IMG[name]}" style="width:${w}px;height:${h ?? w}px;object-fit:cover" alt="">`;

  // icons
  const SVG = {
    heart: (c) => `<svg width="24" height="22" viewBox="0 0 24 22"><path fill="${c}" d="M12 21.2l-1.5-1.3C5.3 15.2 2 12.2 2 8.3 2 5.1 4.4 2.7 7.5 2.7c1.8 0 3.4.8 4.5 2.1 1.1-1.3 2.7-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.6 0 3.9-3.3 6.9-8.5 11.6L12 21.2z"/></svg>`,
    bars: (c) => `<svg width="24" height="22" viewBox="0 0 24 22"><rect x="3.5" y="9" width="4.6" height="12" rx="1" fill="${c}"/><rect x="9.7" y="2" width="4.6" height="19" rx="1" fill="${c}"/><rect x="15.9" y="6" width="4.6" height="15" rx="1" fill="${c}"/></svg>`,
    people: (c) => `<svg width="30" height="22" viewBox="0 0 30 22"><circle cx="9.5" cy="6" r="4.6" fill="${c}"/><path d="M1 21c0-5.2 3.8-8.6 8.5-8.6S18 15.8 18 21z" fill="${c}"/><circle cx="20.5" cy="6" r="4.6" fill="${c}"/><path d="M12 21c0-5.2 3.8-8.6 8.5-8.6S29 15.8 29 21z" fill="${c}"/></svg>`,
    chev: (c = '#3c3c43', w = 10, h = 17) => `<svg width="${w}" height="${h}" viewBox="0 0 10 17"><path d="M1.5 1.5l7 7-7 7" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    back: `<svg width="9" height="14" viewBox="0 0 9 14"><path d="M7.5 1.5L2 7l5.5 5.5" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    profile: `<svg width="27" height="27" viewBox="0 0 27 27"><circle cx="13.5" cy="13.5" r="12" fill="none" stroke="#3a3a3c" stroke-width="2"/><circle cx="13.5" cy="10.8" r="4.3" fill="none" stroke="#3a3a3c" stroke-width="2"/><path d="M6.2 21.6c1.6-3 4.2-4.6 7.3-4.6s5.7 1.6 7.3 4.6" fill="none" stroke="#3a3a3c" stroke-width="2"/></svg>`,
    minibars: `<svg width="12" height="11" viewBox="0 0 12 11"><rect x="0" y="5" width="2.6" height="6" fill="#3a3a3c"/><rect x="4.4" y="0" width="2.6" height="11" fill="#3a3a3c"/><rect x="8.8" y="3" width="2.6" height="8" fill="#3a3a3c"/></svg>`,
    check: (c) => `<svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6l3.2 3.1L10 1.3" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    search: `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="5.3" fill="none" stroke="#8a8a8e" stroke-width="1.7"/><path d="M10.8 10.8l4 4" stroke="#8a8a8e" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    mic: `<svg width="12" height="17" viewBox="0 0 12 17"><rect x="3.3" y="0.8" width="5.4" height="10" rx="2.7" fill="#8a8a8e"/><path d="M1 8.2c0 2.8 2.2 5 5 5s5-2.2 5-5M6 13.2v3" fill="none" stroke="#8a8a8e" stroke-width="1.4" stroke-linecap="round"/></svg>`,
    share: `<svg width="15" height="18" viewBox="0 0 15 18"><path d="M7.5 1v10M4 4.4l3.5-3.4L11 4.4" fill="none" stroke="#8a8a8e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 7.5H2v9.5h11V7.5h-3" fill="none" stroke="#8a8a8e" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
    image: `<svg width="13" height="11" viewBox="0 0 13 11"><rect x=".7" y=".7" width="11.6" height="9.6" rx="1.5" fill="none" stroke="#fff" stroke-width="1.3"/><path d="M2 9l3-3.2 2.2 2.2L9 6l2 3" fill="none" stroke="#fff" stroke-width="1.2"/></svg>`,
  };

  // ================= animated state =================
  // Every frame starts from each element's base state; cues (in order) then write on top.
  const managed = new Map();
  let FRAME = 0;
  function base(e, s) { const m = reg(e); Object.assign(m.base, s); return e; }
  function reg(e) { let m = managed.get(e); if (!m) { m = { base: {}, cur: null, f: -1, last: {} }; managed.set(e, m); } return m; }
  function S(e) { const m = reg(e); if (m.f !== FRAME) { m.f = FRAME; m.cur = Object.assign({}, m.base); } return m.cur; }
  function flush() {
    for (const [e, m] of managed) {
      const s = m.f === FRAME ? m.cur : m.base;
      const tx = s.tx ?? 0, ty = s.ty ?? 0, sc = s.sc ?? 1, rot = s.rot ?? 0;
      const tf = `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${sc.toFixed(4)})` + (rot ? ` rotate(${rot.toFixed(2)}deg)` : '');
      const op = s.op ?? 1;
      const out = {
        transform: tf, opacity: op.toFixed(3), visibility: op <= 0.002 ? 'hidden' : 'visible',
        filter: s.blur || (s.bright ?? 1) !== 1 ? `blur(${(s.blur || 0).toFixed(2)}px) brightness(${(s.bright ?? 1).toFixed(3)})` : 'none',
      };
      if (s.z !== undefined) out.zIndex = String(s.z);
      if (s.w !== undefined) out.width = s.w.toFixed(2) + 'px';
      if (s.h !== undefined) out.height = s.h.toFixed(2) + 'px';
      if (s.bg !== undefined) out.background = s.bg;
      if (s.shadow !== undefined) out.boxShadow = s.shadow;
      if (s.clip !== undefined) out.clipPath = s.clip;
      if (s.css) Object.assign(out, s.css);
      for (const k in out) if (m.last[k] !== out[k]) { e.style[k] = out[k]; m.last[k] = out[k]; }
      if (s.txt !== undefined && m.lastTxt !== s.txt) { e.textContent = s.txt; m.lastTxt = s.txt; }
      if (s.html !== undefined && m.lastHtml !== s.html) { e.innerHTML = s.html; m.lastHtml = s.html; }
    }
  }
  const cues = [];
  // fn(p, elapsed) runs every frame once t >= t0; p is 0..1 over dur (1 once past).
  function cue(t0, dur, fn) { cues.push({ t0, dur, fn }); }
  let zc = 10;

  // ---------- generic moves ----------
  function fadeUp(e, t0, d = 0.55, dy = 16, ease = E.ui) {
    base(e, { op: 0 });
    cue(t0, d, (p) => { const q = ease(p); const s = S(e); s.op = q; s.ty = (s.ty ?? 0) + dy * (1 - q); });
  }
  function fadeOut(e, t0, d = 0.35, dy = 0) {
    cue(t0, d, (p) => { const q = E.out(p); const s = S(e); s.op = (s.op ?? 1) * (1 - q); s.ty = (s.ty ?? 0) + dy * q; });
  }
  function stagger(list, t0, gap = 0.06, d = 0.55, dy = 16) { list.forEach((e, i) => e && fadeUp(e, t0 + i * gap, d, dy)); }
  function showAt(e, t0) { base(e, { op: 0 }); cue(t0, 0, () => (S(e).op = 1)); }
  function hideAt(e, t0) { cue(t0, 0, () => (S(e).op = 0)); }

  // ================= stage pieces =================
  // grain to keep the soft gradient from banding in 8-bit video
  (() => {
    const g = document.getElementById('grain'), c = g.getContext('2d'), d = c.createImageData(480, 270);
    let s = 1234567;
    for (let i = 0; i < d.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = 110 + (s % 90); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    c.putImageData(d, 0, 0); g.style.width = '1920px'; g.style.height = '1080px'; g.style.imageRendering = 'pixelated';
  })();

  function makePhone() {
    const p = el(`<div class="phone m">
      <div class="btn-side" style="left:-6px;top:170px;height:30px"></div>
      <div class="btn-side" style="left:-6px;top:225px;height:58px"></div>
      <div class="btn-side" style="left:-6px;top:295px;height:58px"></div>
      <div class="btn-side" style="right:-6px;top:250px;height:90px"></div>
      <div class="screen" data-k="screen">
        <div class="status"><div class="time">9:41</div>
          <svg style="left:288px" width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="5" y="5" width="3" height="6" rx=".8"/><rect x="10" y="2.5" width="3" height="8.5" rx=".8"/><rect x="15" y="0" width="3" height="11" rx=".8"/></svg>
          <svg style="left:311px" width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.2-1.2C13.5 1.6 10.9.5 8 .5S2.5 1.6.6 3.5l1.2 1.2C3.4 3.1 5.6 2.2 8 2.2zm0 3.4c1.5 0 2.8.6 3.8 1.5L13 5.9C11.7 4.6 9.9 3.9 8 3.9s-3.7.7-5 2l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zM8 9l2-2c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8z"/></svg>
          <svg style="left:332px" width="27" height="12" viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2"/><path d="M24 4v4c.8-.3 1.3-1.1 1.3-2S24.8 4.3 24 4z" opacity=".45"/></svg>
        </div>
        <div class="island"></div>
        <div class="homeind"></div>
        <div class="touch m" data-k="touch"></div>
      </div>
    </div>`);
    stage.appendChild(p);
    const k = refs(p);
    base(p, { op: 0 });
    base(k.touch, { op: 0 });
    return { el: p, screen: k.screen, touch: k.touch };
  }
  // place a phone by its centre on the 1920 x 1080 stage
  function place(s, cx, cy, sc = 1) { s.tx = cx - 207; s.ty = cy - 434; s.sc = sc; }
  function mount(phone, scr) { phone.screen.appendChild(scr.el); base(scr.el, { op: 0 }); return scr; }

  function screen(inner, extra = '') { const e = el(`<div class="scr m" ${extra}>${inner}</div>`); return { el: e, k: refs(e) }; }

  // ---------- touches ----------
  // A soft touch appears at (x, y) on the screen, presses at `at`, lifts and fades.
  function tap(phone, x, y, at, target) {
    const tch = phone.touch;
    cue(at - 0.3, 0.75, (p, el) => {
      const s = S(tch); const u = el - 0.3;          // seconds relative to the press
      s.tx = x; s.ty = y;
      if (u < 0) { const q = E.out(clamp((u + 0.3) / 0.22)); s.op = q; s.sc = 1.25 - 0.25 * q; }
      else if (u < 0.14) { s.op = 1; s.sc = 1 - 0.16 * E.out(u / 0.14); }
      else { const q = clamp((u - 0.14) / 0.31); s.op = 1 - E.out(q); s.sc = 0.84 + 0.36 * E.out(q); }
      if (p >= 1) s.op = 0;
    });
    if (target) cue(at, 0.32, (p) => { const k = Math.sin(Math.PI * p); const s = S(target); s.sc = (s.sc ?? 1) * (1 - 0.035 * k); s.bright = (s.bright ?? 1) * (1 - 0.07 * k); });
  }

  // ---------- screen transitions ----------
  function push(from, to, t0, d = 0.6) {
    const z = ++zc;
    cue(t0, d, (p) => {
      const q = E.push(p);
      const a = S(to); a.op = 1; a.tx = 390 * (1 - q); a.z = z; a.bg = '#fff';
      a.shadow = p < 1 ? `-10px 0 30px rgba(0,0,0,${(0.10 * (1 - q)).toFixed(3)})` : 'none';
      if (from) { const b = S(from); b.tx = -110 * q; b.bright = 1 - 0.05 * Math.sin(Math.PI * Math.min(1, p * 1.1)); if (p >= 1) b.op = 0; }
    });
  }
  // old content drifts up and fades, the new screen rises in behind it
  function rise(from, to, t0, d = 0.6, dist = 26) {
    const z = ++zc;
    if (from) cue(t0, d * 0.6, (p) => { const q = E.out(p); const b = S(from); b.op = (b.op ?? 1) * (1 - q); b.ty = (b.ty ?? 0) - dist * 0.7 * q; if (p >= 1) b.op = 0; });
    cue(t0 + d * 0.25, d, (p) => { const q = E.ui(p); const a = S(to); a.op = q; a.ty = dist * (1 - q); a.z = z; });
  }
  function xfade(from, to, t0, d = 0.32, dy = 8) {
    const z = ++zc;
    if (from) cue(t0, d * 0.8, (p) => { const b = S(from); b.op = (b.op ?? 1) * (1 - E.out(p)); if (p >= 1) b.op = 0; });
    cue(t0 + d * 0.2, d, (p) => { const q = E.ui(p); const a = S(to); a.op = q; a.ty = dy * (1 - q); a.z = z; });
  }

  // ---------- typing ----------
  function typeInto(field, str, t0, step = 0.07) {
    const k = refs(field);
    base(k.v, { txt: '' }); base(k.ph, { op: 1 }); base(k.caret, { op: 0 });
    cue(t0 - 0.3, str.length * step + 1.0, (p, el) => {
      const u = el - 0.3;
      const n = Math.max(0, Math.min(str.length, Math.floor(u / step + 1e-6) + (u >= 0 ? 1 : 0)));
      S(k.v).txt = str.slice(0, n);
      S(k.ph).op = n > 0 ? 0 : 1;
      const typing = u >= 0 && u < str.length * step;
      S(k.caret).op = p >= 1 ? 0 : (typing ? 1 : (Math.floor((el + 10) / 0.5) % 2 === 0 ? 1 : 0));
    });
    cue(t0 + str.length * step + 0.7, 0, () => { S(k.v).txt = str; S(k.ph).op = 0; S(k.caret).op = 0; });
  }
  const field = (x, y, w, ph, h = 43) => `<div class="a field" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><span data-k="ph" class="m" style="position:absolute;left:28px;top:${(h - 18) / 2}px">${ph}</span><span class="v" data-k="v"></span><span class="caret" data-k="caret" style="opacity:0"></span></div>`;

  // ---------- counting ----------
  function countUp(e, to, t0, d = 0.9, fmt = (v) => String(Math.round(v))) {
    base(e, { txt: fmt(0) });
    cue(t0, d, (p) => (S(e).txt = fmt(to * E.out(p))));
  }

    const parts = [c.k.n, c.k.h, c.k.d];
    base(c.el, { op: 1 });
    parts.forEach((e, i) => {
      base(e, { op: 0 });
      cue(t0 + i * 0.09, 0.8, (p) => { const q = E.ui(p); const s = S(e); s.op = q; s.ty = 22 * (1 - q); });
    });
  }
  function capHide(c, t1) {
    [c.k.n, c.k.h, c.k.d].forEach((e, i) => {
      cue(t1 + i * 0.05, 0.4, (p) => { const q = E.in(p); const s = S(e); s.op = (s.op ?? 1) * (1 - q); s.ty = (s.ty ?? 0) - 14 * q; });
    });
  }
  function heading(n, h) {
    const c = el(`<div class="heading"><div class="n" data-k="n">${n}</div><div class="h" data-k="h">${h}</div></div>`);
    stage.appendChild(c);
    return { el: c, k: refs(c) };
  }

  // =====================================================================
  //                              TIMELINE
  // =====================================================================
  // Screens only, about 19 s: onboarding gets most of the time, then the
  // summary and analysis, then four more screens side by side.
  const CX = 960, CY = 540;
  const main = makePhone();
  const tb = tabbar(main);
  const al = alertLayer(main);

  // ---------- 0. splash dot -> welcome ----------
  const wel = mount(main, scrWelcome());
  const wk = wel.k;
  cue(0, 0, () => (S(wel.el).op = 1));
  cue(0, 0.9, (p) => { const q = E.ui(p); const s = S(main.el); place(s, CX, CY + 60 * (1 - q), 0.95 + 0.05 * q); s.op = q; });
  const SPL = { x: 195 - 66, y: 422 - 208, s: 2.2 };
  for (const e of [wk.dot]) base(e, { tx: SPL.x, ty: SPL.y, sc: SPL.s });
  base(wk.tile, { op: 0 });
  base(wk.ring1, { op: 0, tx: SPL.x, ty: SPL.y });
  base(wk.ring2, { op: 0, tx: SPL.x, ty: SPL.y });
  [0.2, 0.5].forEach((t0, i) => {
    const r = i ? wk.ring2 : wk.ring1;
    cue(t0, 1.0, (p) => { const s = S(r); s.op = p < 1 ? 0.9 * Math.sin(Math.PI * Math.min(1, p * 1.15)) * (1 - p) : 0; s.sc = 0.5 + 1.1 * E.out(p); s.tx = SPL.x; s.ty = SPL.y; });
  });
  const T_MORPH = 0.95;
  cue(T_MORPH, 0.75, (p) => {
    const q = E.io(p);
    const s = S(wk.dot); s.tx = SPL.x * (1 - q); s.ty = SPL.y * (1 - q); s.sc = lerp(SPL.s, 1, q);
    const t = S(wk.tile); t.op = clamp((p - 0.5) / 0.5); t.sc = 0.9 + 0.1 * E.out(t.op);
  });
  stagger([wk.title, wk.body], T_MORPH + 0.4, 0.08, 0.6, 16);
  stagger([wk.go, wk.sign], T_MORPH + 0.55, 0.08, 0.6, 16);
  tap(main, 300, 712, 2.15, wk.go);

  // ---------- 1. connect devices ----------
  let T = 2.4;
  const con = mount(main, scrConnect());
  const ck = con.k;
  rise(wel.el, con.el, T, 0.55);
  cue(T, 3.2, (p, e) => {
    ['o1', 'o2', 'o3', 'o4'].forEach((n, i) => ck[n].setAttribute('stroke-dashoffset', String((-(e + 10) * (16 + i * 4)).toFixed(1))));
    ck.ph.setAttribute('transform', `translate(0 ${(Math.sin((e + 10) * 2.2) * 4).toFixed(2)})`);
    ck.wa.setAttribute('transform', `translate(0 ${(Math.sin((e + 10) * 2.2 + 1.7) * 4).toFixed(2)})`);
    S(ck.spin).rot = ((e * 400) | 0) - (((e * 400) | 0) % 45);
  });
  stagger([ck.title, ck.body], T + 0.2, 0.07, 0.6, 16);
  base(ck.illu, { op: 0 }); cue(T + 0.35, 0.65, (p) => { const q = E.ui(p); const s = S(ck.illu); s.op = q; s.sc = 0.94 + 0.06 * q; });
  fadeUp(ck.searching, T + 0.45, 0.5, 10);
  fadeUp(ck.skip, T + 0.45, 0.5, 10);
  const T_FOUND = T + 1.15;
  cue(T_FOUND, 0.35, (p) => { const q = E.in(p); const s = S(ck.illu); s.op = (s.op ?? 1) * (1 - q); s.sc = (s.sc ?? 1) * (1 - 0.06 * q); const t = S(ck.searching); t.op = (t.op ?? 1) * (1 - q); });
  base(ck.card, { op: 0 });
  cue(T_FOUND + 0.2, 0.6, (p) => { const q = E.ui(p); const s = S(ck.card); s.op = q; s.ty = 40 * (1 - q); s.sc = 0.97 + 0.03 * q; });
  base(ck.connected, { op: 0 });
  const T_CONN = T_FOUND + 0.85;
  tap(main, 60, 556, T_CONN, ck.connect);
  cue(T_CONN + 0.15, 0.35, (p) => { const q = E.ui(p); S(ck.connect).op = 1 - q; const s = S(ck.connected); s.op = q; s.sc = 0.9 + 0.1 * q; });
  cue(T_CONN + 0.3, 0.25, (p) => { const s = S(ck.skip); s.op = (s.op ?? 1) * (1 - E.out(p)); });
  base(ck.go, { op: 0 }); cue(T_CONN + 0.35, 0.5, (p) => { const q = E.ui(p); const s = S(ck.go); s.op = q; s.ty = 16 * (1 - q); });
  const T_FWD = T_CONN + 0.85;
  tap(main, 282, 760, T_FWD, ck.go);

  // ---------- 2. getting to know you ----------
  T = T_FWD + 0.25;
  const intro = mount(main, scrIntro());
  const ik = intro.k;
  rise(con.el, intro.el, T, 0.55);
  stagger([ik.icon, ik.title, ik.body], T + 0.2, 0.07, 0.6, 16);
  stagger([ik.ok, ik.later], T + 0.4, 0.07, 0.5, 12);
  const T_READY = T + 1.0;
  tap(main, 277, 701, T_READY, ik.ok);

  const qs = scrQuestions([
    { n: '1 of 5', q: 'Do you have a vision number?', w: 250, buttons: [['Yes, I do', '', BR[0], 680, BR[1]], ['No, I don’t', '', BR[0], 740, BR[1]]] },
    { n: '2 of 5', q: 'Have you gotten your eyes checked in the past 6 months?', w: 275, buttons: [['Yes, I have', '', BR[0], 680, BR[1]], ['Skip the question', 'gry', 42, 740, 158], ['No, I haven’t', '', BR[0], 740, BR[1]]] },
    { n: '3 of 5', q: 'Do you follow any eye care routines?', w: 260, buttons: [['Yes, I do', '', BR[0], 680, BR[1]], ['Skip the question', 'gry', 42, 740, 158], ['No, I don’t', '', BR[0], 740, BR[1]]] },
    { n: '4 of 5', q: 'Do you wear your glasses regularly?', w: 270, buttons: [['Daily', '', BR[0], 680, BR[1]], ['Only when necessary', '', 184, 740, 179]] },
    { n: '5 of 5', q: 'Do you have any medical history related to your eyesight?', w: 270, buttons: [['Yes, I do', '', BR[0], 680, BR[1]], ['No, I don’t', '', BR[0], 740, BR[1]]] },
  ], ['My vision number is<br>-0.5 and -0.75', 'Number since the past<br>2 years', 'Last checkup was more<br>than 6 months ago', 'No eye care routine', 'Wears glasses when<br>necessary']);
  mount(main, qs);
  const qk = qs.k;
  for (let i = 0; i < 5; i++) base(qk['s' + i], { op: 0 });
  for (let i = 0; i < 5; i++) base(qk['q' + i], { op: 0 });
  function qSwap(i, t0) {
    cue(t0, 0.3, (p) => { const q = E.out(p); const s = S(qk['q' + (i - 1)]); s.op = (s.op ?? 1) * (1 - q); s.ty = (s.ty ?? 0) - 20 * q; if (p >= 1) s.op = 0; });
    cue(t0 + 0.12, 0.55, (p) => { const q = E.ui(p); const s = S(qk['q' + i]); s.op = q; s.ty = 22 * (1 - q); });
  }
  function sumIn(i, t0) { cue(t0, 0.5, (p) => { const q = E.ui(p); const s = S(qk['s' + i]); s.op = q; s.ty = 10 * (1 - q); }); }

  T = T_READY + 0.25;
  rise(intro.el, qs.el, T, 0.5);
  cue(T + 0.1, 0.55, (p) => { const q = E.ui(p); const s = S(qk.q0); s.op = q; s.ty = 18 * (1 - q); });
  const T_Q1 = T + 0.7;
  tap(main, 294, 701, T_Q1, qk.b0_0);

  // the vision number, typed in
  const vn = mount(main, scrVisionNumber());
  const vk = vn.k;
  T = T_Q1 + 0.25;
  rise(qs.el, vn.el, T, 0.5);
  stagger([vk.t1, vk.f1, vk.t2, vk.f2, vk.go], T + 0.1, 0.04, 0.5, 12);
  typeInto(vk.f1, '-0.5 and -0.75', T + 0.5, 0.032);
  typeInto(vk.f2, '2 years', T + 1.1, 0.04);
  const T_VN = T + 1.5;
  tap(main, 280, 761, T_VN, vk.go);

  // back to the questions, the first answers collect at the top
  T = T_VN + 0.25;
  cue(T, 0.35, (p) => { const s = S(vn.el); s.op = 1 - E.out(p); s.ty = -16 * E.out(p); if (p >= 1) s.op = 0; });
  cue(T + 0.08, 0.5, (p) => { const q = E.ui(p); const s = S(qs.el); s.op = q; s.ty = 0; s.z = ++zc; });
  cue(T + 0.08, 0, () => { S(qk.q0).op = 0; });
  sumIn(0, T + 0.15); sumIn(1, T + 0.25);
  cue(T + 0.2, 0.55, (p) => { const q = E.ui(p); const s = S(qk.q1); s.op = q; s.ty = 22 * (1 - q); });
  const STEP = 0.66;
  let tq = T + 0.85;
  tap(main, 294, 761, tq, qk.b1_2); sumIn(2, tq + 0.22); qSwap(2, tq + 0.22); tq += STEP;   // No, I haven't
  tap(main, 294, 761, tq, qk.b2_2); sumIn(3, tq + 0.22); qSwap(3, tq + 0.22); tq += STEP;   // No, I don't
  tap(main, 273, 761, tq, qk.b3_1); sumIn(4, tq + 0.22); qSwap(4, tq + 0.22); tq += STEP;   // Only when necessary
  tap(main, 294, 761, tq, qk.b4_1);                                                         // No, I don't

  // ---------- 3. summary ----------
  T = tq + 0.25;
  const sum = mount(main, scrSummary());
  const sk = sum.k;
  rise(qs.el, sum.el, T, 0.6, 28);
  cue(T + 0.2, 0.6, (p) => { const q = E.ui(p); const s = S(tb.el); s.op = q; s.ty = 30 * (1 - q); });
  tabTo(tb, 0, T + 0.2, 0.01);
  stagger([sk.date, sk.title, sk.prof, sk.act, sk.see, sk.card, sk.bars, sk.rec, sk.c0, sk.c1, sk.c2, sk.c3], T + 0.15, 0.035, 0.6, 16);
  [['b0', 0.4], ['b1', 0.24], ['b2', 0.7]].forEach(([k, v], i) => {
    base(sk[k], { w: 0 });
    cue(T + 0.55 + i * 0.1, 0.9, (p) => { const q = E.ui(p); S(sk[k]).w = 289 * v * q; S(sk[k + 'l']).op = q; S(sk[k + 'l']).tx = -289 * v * (1 - q); });
  });
  const T_TAB_A = T + 1.3;
  tap(main, 196, 812, T_TAB_A, null);

  // ---------- 4. analysis and the screen-distance alert ----------
  T = T_TAB_A + 0.12;
  const an = mount(main, scrAnalysis());
  const ak = an.k;
  xfade(sum.el, an.el, T, 0.3, 10);
  tabTo(tb, 1, T);
  [['a0', 0.75], ['a1', 0.45], ['a2', 1]].forEach(([k, v], i) => {
    base(ak[k], { h: 0 });
    cue(T + 0.25 + i * 0.08, 0.8, (p) => (S(ak[k]).h = 150 * v * E.ui(p)));
  });
  const T_AL = T + 0.85;
  cue(T_AL, 0.4, (p) => { const q = E.ui(p); S(al.el).op = q; S(al.k.veil).op = q; });
  cue(T_AL + 0.1, 0.5, (p) => { const q = E.ui(p); const s = S(al.k.close); s.op = q; s.ty = 14 * (1 - q); });
  cue(T_AL, 1.4, (p, e) => {
    [al.k.c0, al.k.c1, al.k.c2].forEach((c, i) => {
      const w = 0.5 + 0.5 * Math.sin((e * 2 * Math.PI) / 0.9 - i * 0.9);
      c.setAttribute('opacity', (0.35 + 0.65 * w).toFixed(2));
    });
  });
  const T_OK = T_AL + 0.9;
  cue(T_OK, 0.35, (p) => { const q = E.out(p); const s = S(al.k.close); s.op = (s.op ?? 1) * (1 - q); s.ty = (s.ty ?? 0) - 10 * q; });
  cue(T_OK + 0.15, 0.5, (p) => { const q = E.ui(p); const s = S(al.k.ok); s.op = q; s.ty = 10 * (1 - q); });
  cue(T_OK + 0.2, 0.75, (p) => {
    al.k.ring.setAttribute('stroke-dashoffset', (88 * (1 - E.ui(clamp(p / 0.7)))).toFixed(2));
    al.k.tick.setAttribute('stroke-dashoffset', (20 * (1 - E.ui(clamp((p - 0.45) / 0.55)))).toFixed(2));
  });
  const T_ALX = T_OK + 0.75;
  cue(T_ALX, 0.4, (p) => { const q = E.out(p); const s = S(al.el); s.op = (s.op ?? 1) * (1 - q); if (p >= 1) s.op = 0; });

  // ---------- 5. four more screens side by side ----------
  const T_SPREAD = T_ALX + 0.25;
  const SP = { s: 0.8, xs: [372, 764, 1156, 1548], y: 540 };
  const spreadPhone = (scr, tab) => {
    const ph = makePhone();
    const t = tabbar(ph);
    if (tab >= 0) { base(t.el, { op: 1 }); base(t.k['on' + tab], { op: 1 }); }
    const s = mount(ph, scr);
    base(s.el, { op: 1 });
    return { ph, scr: s };
  };
  const others = [
    spreadPhone(scrActivity(ACT.ga), 0),
    spreadPhone(scrResult(), -1),
    spreadPhone(scrConsult(), 2),
  ];
  // the analysis phone slides to the first slot; the others arrive from the right
  cue(T_SPREAD, 1.0, (p) => { const q = E.io(p); place(S(main.el), lerp(CX, SP.xs[0], q), CY, lerp(1, SP.s, q)); });
  others.forEach(({ ph, scr }, j) => {
    const i = j + 1, t0 = T_SPREAD + 0.1 + j * 0.08;
    cue(t0, 0.95, (p) => { const q = E.ui(p); const s = S(ph.el); place(s, SP.xs[i] + 260 * (1 - q), SP.y + 24 * (1 - q), SP.s * (0.96 + 0.04 * q)); s.op = clamp(p * 2.2); });
    const k = scr.k;
    const items = [k.title, k.see, k.main, k.sc, k.sk, k.r0, k.r1, k.r2, k.r3, k.c1, k.c2, k.tell, k.next, k.d0, k.d1, k.d2, k.d3].filter(Boolean);
    stagger(items, t0 + 0.25, 0.04, 0.6, 14);
  });
  countUp(others[0].scr.k.score, ACT.ga.score, T_SPREAD + 0.5, 1.0);
  const rk = others[1].scr.k;
  [['x0', 172], ['x1', 98], ['x2', 144]].forEach(([k, w], i) => { base(rk[k], { w: 0 }); cue(T_SPREAD + 0.6 + i * 0.08, 0.9, (p) => { S(rk[k]).w = w * E.ui(p); S(rk[k + 'l']).op = E.ui(p); }); });
  countUp(rk.score, 124, T_SPREAD + 0.5, 1.0);

  // ---------- 6. out ----------
  const T_END = T_SPREAD + 2.5;
  [main, ...others.map((o) => o.ph)].forEach((ph, i) => {
    cue(T_END + i * 0.07, 0.7, (p) => { const q = E.in(p); const s = S(ph.el); s.op = (s.op ?? 1) * (1 - q); s.ty = (s.ty ?? 0) + 40 * q; });
  });

  const DURATION = Math.ceil((T_END + 0.9) * 10) / 10;

  // =====================================================================
  //                         playback & export
  // =====================================================================
  function renderAt(t) {
    FRAME++;
    for (const c of cues) {
      if (t < c.t0) continue;
      const el = t - c.t0;
      c.fn(c.dur > 0 ? clamp(el / c.dur) : 1, el);
    }
    flush();
  }

  const frame = document.getElementById('frame');
  function fit() { if (!document.body.classList.contains('export')) stage.style.transform = `scale(${frame.clientWidth / 1920})`; }
  window.addEventListener('resize', fit); fit();

  const scrub = document.getElementById('scrub'), playBtn = document.getElementById('play'), meta = document.getElementById('meta');
  let playing = true, t0 = performance.now(), tNow = 0, exporting = false;
  function tick(now) {
    if (exporting) return;
    if (playing) { tNow = ((now - t0) / 1000) % DURATION; renderAt(tNow); scrub.value = String(Math.round((tNow / DURATION) * 1000)); meta.textContent = `${tNow.toFixed(2)} s / ${DURATION} s · 1920 × 1080 · 60 fps`; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; if (playing) t0 = performance.now() - tNow * 1000; };
  scrub.oninput = () => { playing = false; playBtn.textContent = 'Play'; tNow = (scrub.value / 1000) * DURATION; renderAt(tNow); meta.textContent = `${tNow.toFixed(2)} s / ${DURATION} s`; };

  window.anim = {
    timeline: { duration: DURATION, fps: 60 },
    ready: Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]),
    exportMode(on) { exporting = on; document.body.classList.toggle('export', on); stage.style.transform = on ? 'none' : ''; if (!on) fit(); },
    renderAt,
  };
})();
</script>
</body>
</html>
