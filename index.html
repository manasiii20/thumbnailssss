<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f2f6;
    --panel: #ffffff;
    --ink: #1d1a22;
    --muted: #6d6875;
    --line: #e4e0ea;
    --accent: #b05fd6;
    --on-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17141b; --panel: #211d27; --ink: #efeaf4; --muted: #a39cae;
      --line: #36303f; --accent: #cc8af0; --on-ink: #17141b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17141b; --panel: #211d27; --ink: #efeaf4; --muted: #a39cae;
    --line: #36303f; --accent: #cc8af0; --on-ink: #17141b; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    align-items: flex-start;
    justify-content: center;
    padding-block: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .stage-wrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  /* The canvas buffer is 2x; it is shown at the true 482 x 402 thumbnail size. */
  #stage {
    width: 482px;
    height: 402px;
    max-width: 100%;
    height: auto;
    aspect-ratio: 482 / 402;
    display: block;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(60,20,80,.12);
  }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .panel {
    width: 300px;
    max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    display: grid;
    gap: 14px;
  }
  h1 { font-size: 15px; margin: 0; }
  label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; }
  .row output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=number] {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%;
  }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; border-radius: 8px; padding: 9px 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: progress; }
  .file { position: relative; overflow: hidden; text-align: center; }
  .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #status { font-size: 12px; color: var(--muted); min-height: 1.4em; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
</style>
</head>
<body>
<main>
  <div class="stage-wrap">
    <canvas id="stage" width="964" height="804"></canvas>
    <div class="meta" id="meta">482 × 402 · 2x</div>
  </div>

  <div class="panel">
    <h1>Thumbnail Studio</h1>

    <label>Thumbnail (text layer)
      <select id="overlay"></select>
    </label>
    <button class="file">Load text PNG<input type="file" id="overlayFile" accept="image/png"></button>

    <hr>

    <label><span class="row">Motion <output id="motionOut"></output></span>
      <input type="range" id="motion" min="0" max="2" step="0.05">
    </label>
    <label><span class="row">Vividness <output id="vividOut"></output></span>
      <input type="range" id="vivid" min="0.6" max="1.6" step="0.05">
    </label>
    <label><span class="row">White light <output id="lightOut"></output></span>
      <input type="range" id="light" min="0" max="2" step="0.05">
    </label>
    <div class="two">
      <label>Loop (seconds)<input type="number" id="duration" min="2" max="30" step="1"></label>
      <label>FPS
        <select id="fps"><option>30</option><option>60</option></select>
      </label>
    </div>
    <label>Export size
      <select id="scale">
        <option value="2">964 × 804 (2x, sharp on retina)</option>
        <option value="1">482 × 402 (1x)</option>
      </select>
    </label>

    <hr>

    <button id="play">Pause</button>
    <button class="primary" id="exportMp4">Export MP4 loop</button>
    <button id="exportPng">Export first frame as PNG</button>
    <div id="status"></div>
  </div>
</main>

<script src="assets/embedded.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script>
(() => {
  const W = 482, H = 402;

  // Look settings. Exposed on window.thumb so scripts/render.mjs uses the exact same values.
  const config = {
    motion: 1,      // how strongly the colours flow and fold
    light: 1,       // strength of the drifting white haze
    vivid: 1.0,     // colour saturation (1 = colours as sampled)
    duration: 8,    // seconds per seamless loop
    fps: 60,
    scale: 2,
  };

  const canvas = document.getElementById('stage');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false, alpha: false });
  if (!gl) { document.getElementById('status').textContent = 'WebGL is not available in this browser.'; return; }

  const VERT = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      // p: 0..1 with the origin at the top-left, matching image rows.
      vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
      gl_Position = vec4(aPos, 0.0, 1.0);
    }`;

  const FRAG = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uText;
    uniform vec4 uTextBox;    // bounds of the logos (x0, y0, x1, y1), 0..1
    uniform float uPhase;   // 0..1 across one loop; every term below is periodic in it
    uniform float uMotion;
    uniform float uLight;
    uniform float uVivid;
    uniform float uAspect;  // width / height
    const float TAU = 6.28318530718;

    // Smooth flow field that bends the colour fields into organic shapes.
    // Time enters only as whole multiples of th, so phase 1 equals phase 0.
    vec2 flow(vec2 q, float th) {
      vec2 d = vec2(0.0);
      d += 0.55 * vec2(sin(1.6 * q.y + 0.9 * q.x + th + 0.3),
                       cos(1.4 * q.x - 0.7 * q.y - th + 1.1));
      d += 0.30 * vec2(sin(2.7 * q.y - 1.9 * q.x - 2.0 * th + 2.0),
                       cos(2.2 * q.x + 1.5 * q.y + th + 0.5));
      d += 0.15 * vec2(sin(3.9 * q.x + 3.1 * q.y + 2.0 * th + 4.2),
                       cos(3.6 * q.y - 4.2 * q.x - 3.0 * th + 4.0));
      return d;
    }

    // Colour ramp across the flowing field, sampled from the reference
    // gradient: blush and pinks, then mauve and lilac, then lavender and pale
    // blue. Each stop eases into the next, so neighbouring colours melt together.
    vec3 ramp(float v) {
      vec3 c = vec3(255.0, 186.0, 196.0);                                // blush
      c = mix(c, vec3(255.0, 139.0, 192.0), smoothstep(0.00, 0.16, v)); // pink
      c = mix(c, vec3(255.0, 169.0, 214.0), smoothstep(0.16, 0.30, v)); // light pink
      c = mix(c, vec3(205.0, 151.0, 209.0), smoothstep(0.30, 0.42, v)); // mauve
      c = mix(c, vec3(206.0, 165.0, 231.0), smoothstep(0.42, 0.52, v)); // lilac
      c = mix(c, vec3(203.0, 195.0, 241.0), smoothstep(0.52, 0.66, v)); // lavender
      c = mix(c, vec3(218.0, 233.0, 251.0), smoothstep(0.66, 0.84, v)); // pale blue
      return c / 255.0;
    }

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
      vec2 p = vUv;
      float th = TAU * uPhase;
      vec2 q = (p - 0.5) * vec2(uAspect, 1.0);   // centred; frame is 1.2 wide, 1 tall
      // Two-level domain warp folds the colours into each other, so the
      // shapes keep changing instead of sliding around.
      vec2 qw = q + 0.16 * uMotion * flow(q, th);
      qw += 0.10 * uMotion * flow(1.3 * qw + 2.0, th + 1.7);

      // Position along the ramp: a gradient from blush to pale blue whose
      // direction turns one full circle per loop, so every colour travels around
      // the whole canvas, plus travelling ripples that make the colours undulate.
      float ang = th - 0.675;   // starts on the reference diagonal (bottom left to top right)
      float v = 0.52 + 0.58 * dot(qw, vec2(cos(ang), sin(ang)));
      v += 0.10 * sin(3.0 * qw.y + 2.2 * qw.x + th);
      v += 0.06 * sin(5.0 * qw.x - 3.6 * qw.y - 2.0 * th + 1.0);
      vec3 col = ramp(v);

      // White haze: soft patches that swell and dissolve inside the same
      // warped space, so the white mixes in with the colours as they fold.
      vec2 qh = qw + 0.22 * uMotion * flow(1.5 * qw + 3.0, th + 3.1);   // swirl it
      float h = sin(3.4 * qh.x + 1.2 * qh.y + th + 0.7) * sin(3.0 * qh.y - 1.0 * qh.x - th + 2.0);
      h += 0.35 * sin(2.0 * qh.x - 2.6 * qh.y + 2.0 * th + 4.1);
      float haze = smoothstep(0.30, 1.10, h) * 0.65 * uLight;
      col = mix(col, vec3(252.0, 247.0, 253.0) / 255.0, clamp(haze, 0.0, 1.0));

      // Behind the logos the brightest areas ease slightly towards mauve in a
      // wide soft oval, so the white text always reads.
      vec2 boxC = 0.5 * (uTextBox.xy + uTextBox.zw);
      vec2 boxR = 0.5 * (uTextBox.zw - uTextBox.xy) + vec2(0.08, 0.16);
      vec2 e = (p - boxC) / boxR;
      float guard = exp(-dot(e, e));
      float bright = smoothstep(0.80, 0.96, dot(col, vec3(0.299, 0.587, 0.114)));
      col = mix(col, vec3(205.0, 151.0, 209.0) / 255.0, 0.40 * guard * bright);

      // Vividness: 1 = colours as sampled.
      float luma = dot(col, vec3(0.299, 0.587, 0.114));
      col = clamp(mix(vec3(luma), col, uVivid), 0.0, 1.0);

      // Text layer: white with alpha.
      float a = texture2D(uText, p).a;
      col = mix(col, vec3(1.0), a);

      // Sub-LSB dither so smooth gradients don't band after video compression.
      col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(col, 1.0);
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fragSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    for (const name of ['uText', 'uTextBox', 'uPhase', 'uMotion', 'uLight', 'uVivid', 'uAspect']) u[name] = gl.getUniformLocation(p, name);
    return { p, u };
  }
  const prog = program(FRAG);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function makeTexture(unit) {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  const textTex = makeTexture(1);
  let textBox = [0.5, 0.5, 0.5, 0.5];

  function upload(unit, texture, img) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    // Keep pixel values exactly as stored: no colour-profile conversion, no premultiply.
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('Could not load image'));
      img.src = src;
    });
  }

  function setSize(scale) {
    canvas.width = W * scale;
    canvas.height = H * scale;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function render(phase) {
    const { p, u } = prog;
    gl.useProgram(p);
    gl.uniform1i(u.uText, 1);
    gl.uniform4fv(u.uTextBox, textBox);
    gl.uniform1f(u.uPhase, ((phase % 1) + 1) % 1);
    gl.uniform1f(u.uMotion, config.motion);
    gl.uniform1f(u.uLight, config.light);
    gl.uniform1f(u.uVivid, config.vivid);
    gl.uniform1f(u.uAspect, W / H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // RGBA bytes of the current frame, bottom row first (used by scripts/render.mjs).
  function readPixels() {
    const px = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let s = '';
    for (let i = 0; i < px.length; i += 0x8000) s += String.fromCharCode.apply(null, px.subarray(i, i + 0x8000));
    return btoa(s);
  }

  const assets = window.THUMB_ASSETS;
  const overlaySelect = document.getElementById('overlay');
  const overlays = { ...assets.overlays };
  let currentOverlay = Object.keys(overlays)[0];

  function refreshOverlayList() {
    overlaySelect.innerHTML = '';
    for (const name of Object.keys(overlays)) {
      const o = document.createElement('option');
      o.value = o.textContent = name;
      overlaySelect.appendChild(o);
    }
    overlaySelect.value = currentOverlay;
  }

  async function setOverlay(name) {
    currentOverlay = name;
    const img = await loadImage(overlays[name]);
    upload(1, textTex, img);
    textBox = findTextBox(img);
    overlaySelect.value = name;
  }

  const ready = (async () => {
    refreshOverlayList();
    await setOverlay(currentOverlay);
    setSize(config.scale);
  })();

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const status = (msg) => { $('status').textContent = msg; };
  const fmt = (v) => Number(v).toFixed(2);

  $('motion').value = config.motion; $('motionOut').textContent = fmt(config.motion);
  $('vivid').value = config.vivid; $('vividOut').textContent = fmt(config.vivid);
  $('light').value = config.light; $('lightOut').textContent = fmt(config.light);
  $('duration').value = config.duration;
  $('fps').value = String(config.fps);
  $('scale').value = String(config.scale);

  $('motion').oninput = (e) => { config.motion = +e.target.value; $('motionOut').textContent = fmt(config.motion); };
  $('vivid').oninput = (e) => { config.vivid = +e.target.value; $('vividOut').textContent = fmt(config.vivid); };
  $('light').oninput = (e) => { config.light = +e.target.value; $('lightOut').textContent = fmt(config.light); };
  $('duration').onchange = (e) => { config.duration = Math.max(2, +e.target.value || 8); };
  $('fps').onchange = (e) => { config.fps = +e.target.value; };
  $('scale').onchange = (e) => { config.scale = +e.target.value; };
  overlaySelect.onchange = (e) => setOverlay(e.target.value);

  function readFile(input) {
    return new Promise((resolve) => {
      const f = input.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => resolve({ name: f.name.replace(/\.[^.]+$/, ''), url: r.result });
      r.readAsDataURL(f);
      input.value = '';
    });
  }
  $('overlayFile').onchange = async (e) => {
    const { name, url } = await readFile(e.target);
    overlays[name] = url;
    currentOverlay = name;
    refreshOverlayList();
    await setOverlay(name);
    status(`Loaded text layer “${name}”.`);
  };

  // Bounding box of the visible text, so the shader knows where the logos sit.
  function findTextBox(img) {
    const c = document.createElement('canvas');
    c.width = 241; c.height = 201;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        if (d[(y * c.width + x) * 4 + 3] > 20) {
          x0 = Math.min(x0, x); x1 = Math.max(x1, x);
          y0 = Math.min(y0, y); y1 = Math.max(y1, y);
        }
      }
    }
    if (x1 < 0) return [0.5, 0.5, 0.5, 0.5];
    return [x0 / c.width, y0 / c.height, (x1 + 1) / c.width, (y1 + 1) / c.height];
  }

  let playing = true, exporting = false, t0 = performance.now(), pausedPhase = 0;
  const phaseNow = () => playing ? ((performance.now() - t0) / 1000 / config.duration) % 1 : pausedPhase;
  $('play').onclick = () => {
    if (playing) { pausedPhase = phaseNow(); playing = false; $('play').textContent = 'Play'; }
    else { t0 = performance.now() - pausedPhase * config.duration * 1000; playing = true; $('play').textContent = 'Pause'; }
  };

  function tick() {
    if (!exporting) {
      render(phaseNow());
      $('meta').textContent = `482 × 402 · ${canvas.width / W}x · ${(phaseNow() * config.duration).toFixed(1)}s / ${config.duration}s`;
    }
    requestAnimationFrame(tick);
  }

  // Inside a claude.ai artifact, files are offered through the `downloads`
  // capability (the viewer confirms the save); elsewhere a plain link is used.
  const downloadsCap = window.claude?.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  async function download(blob, filename) {
    if (window.claude?.use) {
      const downloads = await downloadsCap;
      if (!downloads) { status('Saving files is not available in this view. Open index.html from the repo instead.'); return; }
      try { await downloads.save({ filename, data: blob }); }
      catch (e) { if (e.code !== 'declined') status('Could not save: ' + (e.message || e.code)); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  $('exportPng').onclick = () => {
    exporting = true;
    setSize(config.scale);
    render(0);
    canvas.toBlob((b) => {
      download(b, `${currentOverlay}${config.scale === 2 ? '@2x' : ''}.png`);
      exporting = false;
    }, 'image/png');
  };

  // Frame-exact export: every frame is rendered at its own phase and encoded with
  // WebCodecs, so the file loops seamlessly no matter how fast the machine is.
  $('exportMp4').onclick = async () => {
    if (!('VideoEncoder' in window)) {
      status('This browser has no WebCodecs. Use Chrome, Edge or Safari 17+, or run scripts/render.mjs.');
      return;
    }
    const btn = $('exportMp4');
    btn.disabled = true;
    exporting = true;
    try {
      setSize(config.scale);
      const width = canvas.width, height = canvas.height, fps = config.fps;
      const frames = Math.round(config.duration * fps);
      let encCfg = null;
      for (const codec of ['avc1.640033', 'avc1.4d0033', 'avc1.42003e']) {
        const c = { codec, width, height, framerate: fps, bitrate: config.scale === 2 ? 16e6 : 8e6, avc: { format: 'avc' } };
        if ((await VideoEncoder.isConfigSupported(c)).supported) { encCfg = c; break; }
      }
      if (!encCfg) throw new Error('H.264 encoding is not supported in this browser.');

      const muxer = new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width, height, frameRate: fps },
        fastStart: 'in-memory',
      });
      let failure = null;
      const encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => { failure = e; },
      });
      encoder.configure(encCfg);

      for (let i = 0; i < frames; i++) {
        if (failure) throw failure;
        render(i / frames);
        const frame = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
        frame.close();
        while (encoder.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 4));
        if (i % 10 === 0) { status(`Encoding frame ${i + 1} / ${frames}…`); await new Promise((r) => setTimeout(r, 0)); }
      }
      await encoder.flush();
      if (failure) throw failure;
      muxer.finalize();
      download(new Blob([muxer.target.buffer], { type: 'video/mp4' }), `${currentOverlay}${config.scale === 2 ? '@2x' : ''}.mp4`);
      status(`Exported ${frames} frames · ${width} × ${height} · ${config.duration}s loop.`);
    } catch (e) {
      status('Export failed: ' + e.message);
    } finally {
      exporting = false;
      btn.disabled = false;
    }
  };

  window.thumb = {
    config, ready, render, readPixels, setSize, setOverlay,
    overlays: () => Object.keys(overlays),
    exportMode: (v) => { exporting = v; },  // stops the live preview from drawing
  };
  ready.then(() => requestAnimationFrame(tick)).catch((e) => status(e.message));
})();
</script>
</body>
