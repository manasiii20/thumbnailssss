<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Map Thumbnail</title>
<style>
  :root { --bg: #f3f2f1; --muted: #6f6a66; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #191716; --muted: #a39d98; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #191716; --muted: #a39d98; color-scheme: dark; }
  body { margin: 0; background: var(--bg); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 40px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  img { width: 480px; max-width: 100%; height: auto; aspect-ratio: 480 / 463; display: block; background: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(40,30,20,.12); }
  .meta { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <img src="exports/system-map@2x.png" alt="The five subsystems of the stationery shop system map, arranged two, one, two, with all their connections">
  <div class="meta">480 × 463 · shown from the 2x file</div>
</main>
</body>
</html>
